[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
fs_permissions = [
    { access = "read-write", path = "./" },
    { access = "read-write", path = "../web/src/contracts" }
]

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/"
]

[rpc_endpoints]
botchain = "https://rpc.bohr.life"

[etherscan]
botchain = { key = "none", url = "https://scan.bohr.life/api" }
